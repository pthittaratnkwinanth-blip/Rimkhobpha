<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>หน้าจอคนครัว</title>
    <style>
        body { background-color: #121212; color: #fff; padding: 20px; font-family: sans-serif; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .order-card { background-color: #1e1e1e; border-left: 8px solid #ff9800; padding: 15px; border-radius: 8px; }
        .btn-done { background-color: #4caf50; color: white; border: none; padding: 12px; width: 100%; cursor: pointer; border-radius: 5px; }
    </style>
</head>
<body>
    <h2>👨‍🍳 รายการที่ต้องตัก</h2>
    <div class="grid-container" id="kitchenGrid">กำลังโหลดข้อมูล...</div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyzpxoVFs48gulO5NAw1kyir1s5SILdCyX1Qf0gZ-1RoV8iTAoZdGPKk-ZGWeymz72JEA/exec";
        // ใส่ Sheet ID ของพี่
        const SS_ID = "1sZB3Mx32-Vmx81EZQlnWQ4XByVhWnOdyaZPHQxjhQzU";
        const SS_URL = `https://docs.google.com/spreadsheets/d/${SS_ID}/gviz/tq?tqx=out:json&sheet=inventory`;

        async function loadOrders() {
            try {
                let res = await fetch(SS_URL);
                let text = await res.text();
                let json = JSON.parse(text.substring(47, text.length - 2));
                let grid = document.getElementById('kitchenGrid');
                grid.innerHTML = "";
                
                json.table.rows.forEach((row, index) => {
                    // ตรวจสอบข้อมูลแต่ละคอลัมน์ (คอลัมน์ 0=ชื่อ, 1=รายการ, 4=สถานะ)
                    let name = row.c[0]?.v;
                    let food = row.c[1]?.v;
                    let status = row.c[4]?.v;

                    if (status === "รอตัก" && name) {
                        let div = document.createElement('div');
                        div.className = "order-card";
                        div.innerHTML = `<div><b>${name}</b></div><div>${food}</div><br>
                                         <button class="btn-done" onclick="updateStatus('${name}', this)">✅ ตักสำเร็จ</button>`;
                        grid.appendChild(div);
                    }
                });
            } catch(e) { 
                document.getElementById('kitchenGrid').innerHTML = "เกิดข้อผิดพลาดในการโหลดข้อมูล: " + e.message; 
            }
        }

        async function updateStatus(name, btn) {
            btn.innerText = "⏳ กำลังบันทึก...";
            try {
                // ส่งชื่อไปอัปเดตสถานะที่ Google Apps Script
                let res = await fetch(`${WEB_APP_URL}?action=update_status&name=${encodeURIComponent(name)}`, { method: "POST" });
                let result = await res.json();
                if (result.status === "success") {
                    btn.parentElement.remove();
                } else {
                    alert("ไม่สามารถอัปเดตสถานะได้");
                    btn.innerText = "✅ ตักสำเร็จ";
                }
            } catch(e) { 
                alert("เกิดข้อผิดพลาด: " + e.message); 
                btn.innerText = "✅ ตักสำเร็จ";
            }
        }
        
        loadOrders();
        setInterval(loadOrders, 5000);
    </script>
</body>
</html>
