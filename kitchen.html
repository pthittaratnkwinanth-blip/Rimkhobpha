<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าจอคนครัว - ร้านริมขอบฟ้า</title>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: #fff; padding: 20px; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .order-card { background-color: #1e1e1e; border-left: 8px solid #ff9800; border-radius: 8px; padding: 15px; }
        .btn-done { background-color: #4caf50; color: white; border: none; padding: 12px; width: 100%; cursor: pointer; border-radius: 5px; }
    </style>
</head>
<body>
    <h2>👨‍🍳 รายการคิวอาหารที่ต้องตัก</h2>
    <div class="grid-container" id="kitchenGrid">กำลังโหลดข้อมูล...</div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyzpxoVFs48gulO5NAw1kyir1s5SILdCyX1Qf0gZ-1RoV8iTAoZdGPKk-ZGWeymz72JEA/exec"; 
        const SS_ID = "1sZB3Mx32-Vmx81EZQlnWQ4XByVhWnOdyaZPHQxjhQzU";

        async function fetchKitchenOrders() {
            const url = `https://docs.google.com/spreadsheets/d/${SS_ID}/gviz/tq?sheet=inventory&t=${new Date().getTime()}`;
            try {
                let response = await fetch(url);
                let text = await response.text();
                let json = JSON.parse(text.substring(47, text.length - 2));
                let grid = document.getElementById('kitchenGrid');
                grid.innerHTML = "";
                
                let found = false;
                json.table.rows.forEach((row) => {
                    if (row.c[4]?.v === "รอตัก") {
                        found = true;
                        let name = row.c[0]?.v;
                        let card = document.createElement('div');
                        card.className = "order-card";
                        card.innerHTML = `<div>${name}</div><div style="margin-bottom:10px">${row.c[1]?.v}</div>
                                          <button class="btn-done" onclick="markAsDone('${name}', this)">✅ ตักสำเร็จ</button>`;
                        grid.appendChild(card);
                    }
                });
                if (!found) grid.innerHTML = "<div style='grid-column:1/-1; text-align:center;'>🎉 ตักครบหมดแล้ว!</div>";
            } catch (e) { document.getElementById('kitchenGrid').innerHTML = "เกิดข้อผิดพลาดในการโหลด"; }
        }

        async function markAsDone(empName, btn) {
            btn.disabled = true;
            btn.innerText = "⏳ กำลังบันทึก...";
            try {
                // ส่งชื่อไปอัปเดต (ตรวจสอบให้แน่ใจว่า Apps Script รับค่า name ได้)
                await fetch(`${WEB_APP_URL}?action=update_status&name=${encodeURIComponent(empName)}`, { method: "POST" });
                btn.parentElement.parentElement.remove(); // ลบทั้งการ์ดออก
            } catch (e) {
                alert("พลาด!");
                btn.disabled = false;
                btn.innerText = "✅ ตักสำเร็จ";
            }
        }
        window.onload = fetchKitchenOrders;
        setInterval(fetchKitchenOrders, 5000);
    </script>
</body>
</html>
