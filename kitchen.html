<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>หน้าจอคนครัว</title>
    <style>
        /* ตั้งค่าพื้นหลัง */
        body { 
            background-image: url('backgroud kitchen.png'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: #fff; 
            padding: 20px; 
            font-family: 'Kanit', sans-serif; 
            margin: 0;
            min-height: 100vh;
        }

        h2 { 
            text-align: center; 
            background: rgba(0,0,0,0.4); 
            padding: 15px; 
            border-radius: 15px; 
            backdrop-filter: blur(5px);
            width: fit-content;
            margin: 0 auto 20px auto;
        }

        .grid-container { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 20px; 
        }

        /* ปรับการ์ดรายการให้เป็นสีพื้นหลังขาวโปร่งแสง และตัวอักษรสีดำ */
        .order-card { 
            background-color: rgba(255, 255, 255, 0.7); /* เพิ่มความทึบแสงเพื่อให้สีดำเด่นขึ้น */
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 20px; 
            border-radius: 15px; 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            color: #000000; /* เปลี่ยนสีตัวอักษรเป็นสีดำ */
            font-weight: 500;
        }

        .btn-done { 
            background-color: #d4af37; 
            color: #000; 
            font-weight: bold;
            border: none; 
            padding: 12px; 
            width: 100%; 
            cursor: pointer; 
            border-radius: 8px; 
            margin-top: 15px;
            transition: 0.3s;
        }

        .btn-done:hover { background-color: #f1c40f; }
    </style>
</head>
<body>
    <h2>👨‍🍳 รายการที่ต้องตัก</h2>
    <div class="grid-container" id="kitchenGrid">กำลังโหลดข้อมูล...</div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwGlyJAtLM8ysmE39mW-SpSsst3IH9L7uPpLE3eK-JY9BY7jGRDxfFpXn0t3YuTXCXS-Q/exec";
        const SS_URL = "https://docs.google.com/spreadsheets/d/1sZB3Mx32-Vmx81EZQlnWQ4XByVhWnOdyaZPHQxjhQzU/gviz/tq?tqx=out:json&sheet=inventory";

        async function loadOrders() {
            try {
                let res = await fetch(SS_URL);
                let text = await res.text();
                let json = JSON.parse(text.substring(47, text.length - 2));
                let grid = document.getElementById('kitchenGrid');
                grid.innerHTML = "";
                
                json.table.rows.forEach(row => {
                    let name = row.c[0]?.v;
                    let food = row.c[1]?.v;
                    let status = row.c[4]?.v;

                    if (status === "รอตัก" && name) {
                        let div = document.createElement('div');
                        div.className = "order-card";
                        div.innerHTML = `<div><b>ชื่อ:</b> ${name}</div><div><b>เมนู:</b> ${food}</div>
                                         <button class="btn-done" onclick="updateStatus('${name}', this)">✅ ตักสำเร็จ</button>`;
                        grid.appendChild(div);
                    }
                });
            } catch(e) { 
                document.getElementById('kitchenGrid').innerHTML = "โหลดข้อมูลไม่สำเร็จ"; 
            }
        }

        async function updateStatus(name, btn) {
            btn.innerText = "⏳ กำลังบันทึก...";
            try {
                await fetch(`${WEB_APP_URL}?action=update_status&name=${encodeURIComponent(name)}`, { method: "POST" });
                btn.parentElement.remove();
            } catch(e) { alert("เกิดข้อผิดพลาด"); btn.innerText = "✅ ตักสำเร็จ"; }
        }
        
        loadOrders();
        setInterval(loadOrders, 5000);
    </script>
</body>
</html>
