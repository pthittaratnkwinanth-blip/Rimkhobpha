<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ร้านข้าวราดแกงริมขอบฟ้า v5.2 (Protected)</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;700&family=Noto+Sans+Thai:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Noto Sans Thai', 'Noto Sans Myanmar', 'Arial', sans-serif; background-color: #f4f4f9; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden; user-select: none; }
        .lang-switcher { margin-bottom: 15px; display: flex; gap: 10px; }
        .btn-lang { padding: 6px 12px; font-size: 14px; border: 1px solid #ccc; border-radius: 20px; background: white; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-lang.active { background-color: #333; color: white; border-color: #333; }
        .corner-logo { position: fixed; bottom: 15px; right: 15px; width: 220px; opacity: 0.95; z-index: 999; pointer-events: none; filter: drop-shadow(0 3px 6px rgba(0,0,0,0.2)); }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 450px; text-align: center; margin-bottom: 20px; position: relative; z-index: 1; }
        h2 { color: #d9534f; margin-bottom: 10px; margin-top: 5px; }
        h3 { color: #333; margin-top: 10px; text-align: left; }
        .btn { width: 100%; padding: 12px; margin: 8px 0; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; transition: 0.2s; font-weight: bold; }
        .btn-menu { background-color: #f0f0f0; color: #333; border: 1px solid #ccc; }
        .btn-menu.active { background-color: #d9534f; color: white; border-color: #d9534f; }
        .btn-option { background-color: #e0f7fa; color: #006064; }
        .btn-option.active { background-color: #00838f; color: white; }
        .btn-success { background-color: #0288d1; color: white; margin-top: 15px; }
        .result-box { background: #fff8e1; border: 1px solid #ffe082; padding: 15px; border-radius: 8px; margin: 15px 0; text-align: left; }
        input[type="text"], input[type="file"] { width: 92%; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; text-align: center; margin-top: 5px; margin-bottom: 10px; }
        input[type="file"] { background: #fff; cursor: pointer; width: 87%; }
        .total { font-size: 20px; font-weight: bold; color: #d9534f; text-align: center; margin-top: 5px; }
        .booking-list { text-align: left; background: #fafafa; border: 1px solid #ddd; padding: 10px; border-radius: 8px; max-height: 250px; overflow-y: auto; }
        .admin-warning { color: #0288d1; font-size: 13px; font-weight: bold; margin: -5px 0 10px 0; text-align: center; background-color: #e1f5fe; padding: 5px; border-radius: 5px; }
        .bank-box { background: #e8f5e9; border: 1px solid #a5d6a7; padding: 12px; border-radius: 8px; margin-bottom: 15px; text-align: left; font-size: 14px; color: #2e7d32; }
    </style>
</head>

<body>
    <div class="card">
        <h2 data-key="shop_title">🍛 ร้านข้าวราดแกงริมขอบฟ้า</h2>
        <div class="bank-box">...</div>
        <input type="text" id="custName" placeholder="ชื่อลูกค้า หรือ รหัสการจอง">
        <button type="button" id="btnSave" class="btn btn-success" onclick="saveDirectToSheet()">📌 บันทึกรายการจองนี้</button>
    </div>

<script>
    // ส่วนของฟังก์ชันบันทึกที่แก้ไขแล้ว
    async function saveDirectToSheet() {
        const btn = document.getElementById('btnSave');
        btn.disabled = true;
        btn.innerText = "กำลังบันทึก...";

        let name = document.getElementById('custName').value;
        let fileInput = document.getElementById('slipFile');
        let formData = new FormData();

        formData.append("custName", name || "ไม่ระบุชื่อ");
        formData.append("submit_menu", document.getElementById('resName').innerText);
        formData.append("submit_price", totalPrice);
        
        // --- นี่คือบรรทัดที่เพิ่มให้ส่งสถานะไปครับ ---
        formData.append("status", "รอตัก"); 
        // ------------------------------------------

        if (fileInput.files.length > 0) {
            let file = fileInput.files[0];
            let reader = new FileReader();
            reader.onload = function(e) {
                formData.append("slipData", e.target.result.split(",")[1]);
                formData.append("slipName", file.name);
                formData.append("slipType", file.type);
                sendData(formData, btn);
            };
            reader.readAsDataURL(file);
        } else {
            sendData(formData, btn);
        }
    }

    function sendData(formData, btn) {
        fetch("URL_ของ_APPS_SCRIPT_พี่", { method: "POST", body: formData })
        .then(res => res.text())
        .then(data => {
            alert("บันทึกสำเร็จ!");
            location.reload();
        })
        .catch(err => {
            alert("เกิดข้อผิดพลาด: " + err);
            btn.disabled = false;
            btn.innerText = "📌 บันทึกรายการจองนี้";
        });
    }
</script>
</body>
</html>
